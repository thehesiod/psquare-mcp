[project]
name = "parentsquare-mcp"
version = "0.4.0"
description = "MCP server that gives Claude AI access to ParentSquare — feeds, calendar events, messages, directories, plus admin roster management for students and guardians"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
keywords = [
    "parentsquare",
    "mcp",
    "mcp-server",
    "model-context-protocol",
    "claude",
    "school",
    "education",
    "parent-teacher",
    "school-communication",
    "roster",
    "school-admin",
    "student-information-system",
]
authors = [{ name = "thehesiod" }, { name = "jasonko" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications",
    "Topic :: Education",
]
dependencies = [
    "mcp>=2.0.0,<3",
    "requests>=2.32.0",
    "beautifulsoup4>=4.13.0",
    "icalendar>=6.0.0",
]

[project.optional-dependencies]
pdf = ["pymupdf>=1.27.0"]

[dependency-groups]
dev = ["pytest>=8.0.0"]

[project.urls]
Homepage = "https://github.com/thehesiod/psquare-mcp"
Repository = "https://github.com/thehesiod/psquare-mcp"
"Bug Tracker" = "https://github.com/thehesiod/psquare-mcp/issues"

[project.scripts]
parentsquare-mcp = "parentsquare_mcp.server:main"
parentsquare-export-cookies = "parentsquare_mcp.export_cookies:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parentsquare_mcp"]
